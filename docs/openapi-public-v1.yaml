  "/api/vs/user/{address}":
    get:
      operationId: listUserVs
      summary: List public VS claims where the Stellar address is creator or challenger.
      description: "Lists claims where `{address}` is either the creator or a challenger, ordered by descending claim ID.\n\n`{address}` must be a valid case-sensitive Stellar `G…` account or `C…` contract strkey (`parseAddressParam`). Private claim text fields are sanitized to empty strings on public reads."
      x-mimir-cache-control: "s-maxage=15, stale-while-revalidate=60"
      parameters:
        - name: address
          in: path
          required: true
          description: "Case-sensitive Stellar `G…` account or `C…` contract strkey."
          schema:
            type: string
            pattern: "^[GC][A-Z2-7]{55}$"
        - name: refresh
          in: query
          required: false
          description: "Set to `\"1\"` to force hydration from the contract before returning."
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: List public VS claims where the Stellar address is creator or challenger.
          content:
            "application/json":
