x-mimir-rate-limits:
  tier: public_read
  dimensions:
    - ip
    - route
  rules:
    - dimension: ip
      limit: 300
      windowMs: 60000
    - dimension: route
      limit: 600
      windowMs: 60000
x-mimir-freshness:
  vsCacheControlHeader: "s-maxage=15, stale-while-revalidate=60"
  vsRevalidateSeconds: 15
  listFreshnessWindowMs: 60000
  detailFreshnessWindowMs: 15000
  performanceDefaultFreshnessWindowMs: 300000
  staleMultiplier: 5
x-mimir-basket-policy:
  maxSingleAgentBps: 4000
  maxCategoryBps: 6000
  staleSignalAction: skip
  failedCopyAction: keep_idle
x-mimir-health-thresholds:
  minSamples: 20
  monitoredWorkers:
    - oracle
    - market_creator
    - council
    - sync
    - traders
  thresholds:
    workerStaleWarnSec: 180
    workerStaleCriticalSec: 900
    indexStaleWarnSec: 300
    indexStaleCriticalSec: 1800
    queueLagWarnSec: 300
    queueLagCriticalSec: 1800
    settlementWarnSec: 900
    settlementCriticalSec: 3600
    oracleBacklogWarn: 10
    oracleBacklogCritical: 50
    rpcFailureWarn: 0.1
    rpcFailureCritical: 0.5
    facilitatorFailureWarn: 0.05
    facilitatorFailureCritical: 0.25
    sourceFailureWarn: 0.3
    agentBalanceWarnUsdc: 1
    agentBalanceCriticalUsdc: 0.1
