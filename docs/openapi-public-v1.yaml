      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: string
          const: invalid claim id
    VSCacheFreshness:
      type: object
      description: "Read-index or direct-contract freshness metadata (`lib/vs-freshness.ts`)."
      required:
        - source
        - status
        - lastUpdatedAt
        - ageMs
        - freshnessWindowMs
      additionalProperties: false
      properties:
        source:
          type: string
          enum:
            - index
            - contract
          description: "`index` when served from the Postgres/file read cache; `contract` when read directly from Soroban."
        status:
          type: string
          enum:
            - live
            - cached
            - stale
          description: "`live` within freshnessWindowMs, `cached` within 5x window, `stale` beyond."
        lastUpdatedAt:
          type:
            - string
            - "null"
          description: "ISO-8601 timestamp of the last sync, or null if the index has not synced."
        ageMs:
          type:
            - integer
            - "null"
          minimum: 0
          description: "Milliseconds since `lastUpdatedAt`, or null when unknown."
        freshnessWindowMs:
          type: integer
          minimum: 1
          description: "Target freshness window in milliseconds (60000 for feeds, 15000 for detail, 1 for direct contract reads)."
    ClaimChallenger:
      type: object
      description: "A challenger entry on a claim (`lib/contract.ts::ClaimChallenger`)."
      required:
        - address
        - stake
        - potential_payout
      additionalProperties: false
      properties:
        address:
          type: string
          pattern: "^[GC][A-Z2-7]{55}$"
          description: "Challenger Stellar `G…` or `C…` strkey."
        stake:
          type: number
          minimum: 0
          description: Committed stake in display USDC.
        potential_payout:
          type: number
          minimum: 0
          description: Projected gross payout in display USDC if challengers win.
        claimed:
          type: boolean
          description: True once the challenger has pulled their settlement on chain.
    VSData:
      type: object
      description: "Public market / claim representation (`lib/contract.ts::VSData`)."
      required:
        - id
        - creator
        - opponent
        - question
        - creator_position
        - opponent_position
        - resolution_url
        - stake_amount
        - deadline
        - state
        - winner
        - resolution_summary
        - category
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          description: "On-chain claim ID (dense 1-indexed integer)."
        creator:
          type: string
          pattern: "^[GC][A-Z2-7]{55}$"
          description: "Creator Stellar strkey (`G…` or `C…`)."
        opponent:
          type: string
          description: "First challenger strkey, or the zero-address sentinel when unchallenged."
        question:
          type: string
          description: "Market question (redacted to empty string on private claims without invite key)."
        creator_position:
          type: string
          description: Side A position statement.
        opponent_position:
          type: string
          description: Side B counter-position statement.
        counter_position:
          type: string
          description: "Canonical counter-position field from `ClaimData`."
        resolution_url:
          type: string
          description: Primary resolution source URL.
        stake_amount:
          type: number
          minimum: 0
          description: Creator stake in display USDC.
        creator_stake:
          type: number
          minimum: 0
          description: Creator stake in display USDC.
        total_challenger_stake:
          type: number
          minimum: 0
          description: Sum of challenger stakes in display USDC.
        reserved_creator_liability:
          type: number
          minimum: 0
          description: Creator stake locked against fixed-odds challengers.
        available_creator_liability:
          type: number
          minimum: 0
          description: Remaining creator stake open to fixed-odds challenges.
        deadline:
          type: integer
          minimum: 0
          description: Unix timestamp in seconds when staking closes.
        state:
          type: string
          enum:
            - open
            - accepted
            - resolved
            - cancelled
          description: "Lifecycle state (`active` on chain maps to `accepted` in `VSData`)."
        winner:
          type: string
          description: Winning address or zero-address sentinel when unresolved / multi-challenger.
        winner_side:
          type: string
          enum:
            - creator
            - challengers
            - draw
            - unresolvable
            - ""
          description: Resolved winning side.
        resolution_summary:
